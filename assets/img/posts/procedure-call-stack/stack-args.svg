<text x="185" y="280" font-size="13" fill="#3b82f6" text-anchor="end" font-weight="500" >x6 = 6</text>
<text x="130" y="324" font-size="12" fill="#7a8290" text-anchor="middle" font-weight="500" >Diane's Silk Dress Costs $8 9</text>
<text x="480" y="30" font-size="14" fill="#7a8290" text-anchor="middle" font-weight="700" >스택 (bar 진입 직후)</text>
