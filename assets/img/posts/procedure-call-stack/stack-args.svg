<text x="480" y="75" font-size="13" fill="#7a8290" text-anchor="middle" font-weight="600" >•••</text>
<rect x="400" y="100" width="160" height="44" rx="4" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="2"/>
<text x="480" y="127" font-size="13" fill="#3b82f6" text-anchor="middle" font-weight="600" >Arg 8 = 8</text>
<text x="390" y="127" font-size="12" fill="#3b82f6" text-anchor="end" font-weight="600" >0x10(%rsp)</text>
<rect x="400" y="152" width="160" height="44" rx="4" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-width="2"/>
