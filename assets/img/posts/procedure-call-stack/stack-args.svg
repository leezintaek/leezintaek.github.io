<text x="185" y="112" font-size="13" fill="#3b82f6" text-anchor="end" font-weight="500" >x2 = 2</text>
<rect x="60" y="132" width="140" height="34" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="2"/>
