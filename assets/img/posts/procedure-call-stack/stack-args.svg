<text x="390" y="179" font-size="12" fill="#3b82f6" text-anchor="end" font-weight="600" >0x8(%rsp)</text>
<rect x="400" y="204" width="160" height="44" rx="4" fill="#ea580c" fill-opacity="0.18" stroke="#ea580c" stroke-width="2"/>
<text x="480" y="231" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="600" >Return addr</text>
<text x="390" y="231" font-size="12" fill="#ea580c" text-anchor="end" font-weight="600" >(%rsp)</text>
<rect x="400" y="256" width="160" height="44" rx="4" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="480" y="283" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="600" >y = 1</text>
<text x="390" y="283" font-size="12" fill="#16a34a" text-anchor="end" font-weight="600" >-0x8(%rsp)</text>
<line x1="620" y1="226" x2="566" y2="226" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
<text x="624" y="231" font-size="14" fill="#3b82f6" text-anchor="start" font-weight="700" >%rsp</text>
<rect x="396" y="252" width="168" height="120" rx="6" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="3 4"/>
<text x="480" y="332" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700" >red zone</text>
<text x="480" y="352" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="500" >(%rsp 아래 128바이트)</text>
<text x="580" y="132" font-size="12" fill="#7a8290" text-anchor="start" font-weight="500" >역순 push:</text>
<text x="580" y="150" font-size="12" fill="#7a8290" text-anchor="start" font-weight="500" >8 먼저, 7 나중</text>
<text x="360" y="404" font-size="12" fill="#7a8290" text-anchor="middle" font-weight="500" >leaf 함수 bar는 %rsp를 옮기지 않고 -0x8(%rsp)에 y를 바로 씁니다</text>
</svg>
