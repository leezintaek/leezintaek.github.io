<text x="190.0" y="356" font-size="13" fill="#7a8290" text-anchor="middle" font-weight="600">5×5 입력 + Padding 1 (점선 칸 = 0)</text>
<text x="380" y="110" font-size="15" fill="#7a8290" text-anchor="start" font-weight="600">J = 5, M = 3, P = 1, S = 2</text>
<text x="380" y="144" font-size="15" fill="#7a8290" text-anchor="start" font-weight="600"></text>
<text x="380" y="178" font-size="15" fill="#7a8290" text-anchor="start" font-weight="600">Padding 없이:  5 − 3 + 1 = 3</text>
<text x="380" y="212" font-size="15" fill="#3b82f6" text-anchor="start" font-weight="600">Padding 1:  5 + 2 − 3 + 1 = 5 (크기 유지)</text>
<text x="380" y="246" font-size="15" fill="#ea580c" text-anchor="start" font-weight="600">Padding 1, Stride 2:</text>
<text x="380" y="280" font-size="15" fill="#ea580c" text-anchor="start" font-weight="600">⌊(5 + 2 − 3) / 2 + 1⌋ = 3</text>
<text x="380" y="330" font-size="12" fill="#7a8290" text-anchor="start" font-weight="400">파란 칸: 첫 위치,  주황 점선: 2칸 건너뛴 다음 위치</text>
